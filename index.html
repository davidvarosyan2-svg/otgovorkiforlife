<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отговорки</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sticker s1">😂</div>
<div class="sticker s2">🤷‍♂️</div>
<div class="sticker s3">💜</div>
<div class="sticker s4">😎</div>
<div class="sticker s5">🫠</div>
<div class="sticker s6">✨</div>
<div class="sticker s7">🙃</div>
<main>
  <div class="badge">100 ОТГОВОРОК</div>
  <h1>ОТГОВОРКИ</h1>
  <p>Выбери ситуацию и получи готовый ответ.</p>

  <section>
    <div class="categories-wrap">
      <div id="categoryMenu" class="menu"></div>
    </div>

    <button id="generateButton" class="generate-button" type="button">
      🎲 СГЕНЕРИРОВАТЬ ОТВЕТ
    </button>

    <div id="result" class="result hidden">
      <div id="excuseText" class="excuse"></div>
      <div class="result-actions">
        <button id="copyButton" class="copy-button" type="button">Скопировать</button>
        <button id="anotherButton" class="another-button" type="button">✨ Сгенерировать другой ответ</button>
      </div>
      <div id="copied" class="copied hidden">✓ Скопировано</div>
    </div>
  </section>

  <footer>Выбери ситуацию и получи ответ ✨</footer>
</main>
<script src="script.js"></script>
</body>
</html>
