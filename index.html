<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отговорки</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sticker s1">🌈</div>
<div class="sticker s2">😂</div>
<div class="sticker s3">✨</div>
<div class="sticker s4">😭</div>
<div class="sticker s5">💜</div>
<div class="sticker s6">🤡</div>
<div class="sticker s7">🔥</div>
<div class="sticker s8">👀</div>
<div class="sticker s9">🫠</div>
<div class="sticker s10">🤣</div>
<div class="sticker s11">🤝</div>
<div class="sticker s12">💀</div>
<main>
  <div class="brand">ОТГОВОРКИ</div>
  <p class="subtitle">Выбери ситуацию — остальное сделаем за тебя ✨</p>

  <section>
    <div class="category-slider" aria-label="Выбор категории">
      <button id="categoryPrev" class="category-arrow" type="button" aria-label="Предыдущая категория">‹</button>
      <div class="categories-wrap" id="categoryScroller">
        <div id="categoryMenu" class="menu"></div>
      </div>
      <button id="categoryNext" class="category-arrow" type="button" aria-label="Следующая категория">›</button>
    </div>
    <div class="category-scrollbar" aria-hidden="true"><span id="categoryThumb"></span></div>

    <button id="generateButton" class="generate-button" type="button">
      🎲 СГЕНЕРИРОВАТЬ ОТВЕТ
    </button>

    <div id="result" class="result hidden">
      <div id="excuseText" class="excuse"></div>
      <div class="result-actions">
        <button id="anotherButton" class="another-button" type="button">🎲 Сгенерировать другой ответ</button>
      </div>
      <div class="copy-hint">Нажми на текст, чтобы скопировать</div>
    </div>
  </section>

  <footer>Выбери ситуацию и получи ответ ✨</footer>
</main>
<script src="script.js"></script>
</body>
</html>
